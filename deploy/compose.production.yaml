services:
  app:
    environment:
      TRUST_PROXY_HTTPS: '1'
      TRUST_PROXY_CLIENT_IP: '1'
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?Set a fresh PROXY_SHARED_SECRET}
  worker:
    environment:
      TRUST_PROXY_HTTPS: '1'
  caddy:
    image: caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    ports:
    - 80:80
    - 443:443
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set your public hostname}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?Set a fresh PROXY_SHARED_SECRET}
      UPLOAD_MAX_BATCH_BYTES: ${UPLOAD_MAX_BATCH_BYTES:-2147483648}
    volumes:
    - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.5'
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  caddy_data: null
  caddy_config: null
