name: Verify platform
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: arena
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: ci-only-key-never-use-for-deployment
      DATABASE_URL: postgres://arena:ci-only-password@localhost:5432/arena
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.runtime.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.runtime.lock -r requirements.in
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py check
      - run: python manage.py bootstrap_event
      - run: python manage.py collectstatic --noinput
      - run: pytest
      - name: Verify browser interaction helpers
        run: node --test tests/*.cjs
      - name: Check production configuration
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: '0'
          PUBLIC_ORIGIN: https://rescue.example.test
          DJANGO_ALLOWED_HOSTS: rescue.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://rescue.example.test
          DJANGO_SECRET_KEY: CI-ONLY-SECURITY-CHECK-EXAMPLE-NOT-A-PRODUCTION-KEY-8293440128734
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.runtime.lock --no-deps
