{% if not record %}<nav class="editor-type-switch" aria-label="Entry type"><a class="button {% if form_kind == 'event' %}primary{% else %}secondary{% endif %}" data-calendar-type="event" href="?editor=event">Activity</a><a class="button {% if form_kind == 'round' %}primary{% else %}secondary{% endif %}" data-calendar-type="round" href="?editor=round">New round</a><label>Existing round<select data-calendar-existing-round><option value="">Choose a round…</option>{% for item in round_choices %}<option value="{{ item.pk }}">{{ item }}</option>{% endfor %}</select></label></nav>{% endif %}
{% include 'arena/_admin_form.html' %}
{% if record %}<form id="calendar-remove-entry" method="post" action="{% url 'control-action' %}">{% csrf_token %}<input type="hidden" name="action" value="remove-{{ form_kind }}"><input type="hidden" name="id" value="{{ record.pk }}"></form>{% endif %}
