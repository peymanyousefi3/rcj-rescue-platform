{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field 3D viewer</title><link rel="stylesheet" href="{% static 'arena/fields.css' %}"><script type="module" src="{% static 'arena/vendor/model-viewer-4.4.0.min.js' %}"></script><script src="{% static 'arena/field-viewer.js' %}" defer></script></head><body class="field-viewer"><model-viewer src="{% url 'field-media' asset.pk %}" alt="Interactive 3D field" camera-controls touch-action="pan-y" environment-image="neutral" shadow-intensity="0" interaction-prompt="auto"></model-viewer><p role="status" data-field-status>Loading field…</p><nav class="field-camera-controls" aria-label="3D field camera">
<button type="button" data-field-camera="left" aria-label="Rotate field left" title="Rotate left" disabled>↶</button>
<button type="button" data-field-camera="right" aria-label="Rotate field right" title="Rotate right" disabled>↷</button>
<button type="button" data-field-camera="in" aria-label="Zoom field in" title="Zoom in" disabled>+</button>
<button type="button" data-field-camera="out" aria-label="Zoom field out" title="Zoom out" disabled>−</button>
<button type="button" data-field-camera="reset" aria-label="Reset field camera" disabled>Reset</button>
</nav><p class="field-camera-help">Drag to rotate · scroll or pinch to zoom · or use the camera buttons</p></body></html>
