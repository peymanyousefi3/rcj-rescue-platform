{% if complaint.recording_id %}<div class="note-box"><strong>{{ complaint.recording.round }} · {{ complaint.recording.team.name }}</strong><p>Playback position: {{ complaint.playback_timestamp|default:'Not specified' }}</p><button type="button" class="button secondary" data-replay="{% url 'recording-player' complaint.recording_id %}" data-start-ms="{{ complaint.playback_time_ms|default_if_none:0 }}">Open related replay{% if complaint.playback_timestamp %} at {{ complaint.playback_timestamp }}{% endif %}</button></div>{% endif %}
