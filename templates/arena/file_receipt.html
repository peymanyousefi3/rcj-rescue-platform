{% load static %}

<div class="file-receipt"><a class="file-download" href="{% url 'download' file.pk %}"><span>{{ file.original_name }}</span><b><img class="ui-icon" src="{% static 'arena/icons/arrow-down.svg' %}" alt=""></b></a><p class="small muted">{{ file.size|filesizeformat }} · {{ file.created_at|date:'j M · H:i:s T' }}</p><details class="hash-details"><summary>SHA-256 receipt</summary><code>{{ file.sha256 }}</code><button type="button" class="text-link small" data-copy="{{ file.sha256 }}">Copy hash</button></details>{% if file.scan_status != 'clean' %}<span class="badge {% if file.scan_status == 'rejected' %}warning{% else %}neutral{% endif %}">Scan: {{ file.get_scan_status_display }}</span>{% endif %}{% if editable %}<form method="post" action="{% url 'remove-file' file.pk %}" data-confirm="Remove this file from the submission? The audit history will be retained.">{% csrf_token %}<button class="danger-link" type="submit">Remove submission</button></form>{% endif %}</div>
