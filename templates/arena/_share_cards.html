{% for share in resource_shares %}<section class="panel shared-resource"><div class="panel-header"><h2>{{ share.title }}</h2><span class="badge neutral">{{ share.display_files|length }} file{{ share.display_files|length|pluralize }}</span></div><div class="inset">{% for file in share.display_files %}<p><a class="text-link" href="{% url 'download' file.pk %}">{{ file.original_name }}</a> <span class="muted small">{{ file.size|filesizeformat }}</span></p>{% endfor %}</div></section>{% endfor %}
