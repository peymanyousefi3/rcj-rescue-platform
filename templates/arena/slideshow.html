{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>{{ competition.short_name }} · Live slideshow</title><link rel="stylesheet" href="{% static 'arena/slide-assets/fonts.css' %}"><link rel="stylesheet" href="{% static 'arena/slideshow.css' %}"><script src="{% static 'arena/slideshow.js' %}" defer></script></head>
<body><main id="presentation" data-layout="{% static 'arena/slide-assets/layout.json' %}" aria-label="Competition presentation"><div id="slide-content"><section class="slide empty"><h1>Loading competition display…</h1></section></div></main>
<footer class="display-controls"><a href="/" aria-label="Open competition website">Competition website</a><span id="slide-position" aria-live="polite"></span><span id="update-status" role="status">Connecting…</span><div class="control-buttons"><button type="button" id="previous" aria-label="Previous slide">←</button><button type="button" id="pause" aria-label="Pause slideshow">Pause</button><button type="button" id="next" aria-label="Next slide">→</button><button type="button" id="fullscreen">Fullscreen</button></div></footer>
</body></html>
