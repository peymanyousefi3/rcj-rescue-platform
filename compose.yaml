      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-auto}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_DRIVE_PRIVATE_FOLDER_ID: ${GOOGLE_DRIVE_PRIVATE_FOLDER_ID:-}
      SOURCE_WORKBOOK_ID: ${SOURCE_WORKBOOK_ID:-}
      SOURCE_WORKBOOK_ACCESS: ${SOURCE_WORKBOOK_ACCESS:-google}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-4}
      UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-1073741824}
      UPLOAD_MAX_BATCH_BYTES: ${UPLOAD_MAX_BATCH_BYTES:-2147483648}
      UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-5000}
      UPLOAD_TEAM_MAX_BYTES: ${UPLOAD_TEAM_MAX_BYTES:-21474836480}
      UPLOAD_MIN_FREE_BYTES: ${UPLOAD_MIN_FREE_BYTES:-536870912}
      RECORDING_MAX_EXTRACTED_BYTES: ${RECORDING_MAX_EXTRACTED_BYTES:-536870912}
      VALIDATION_MAX_BYTES: ${VALIDATION_MAX_BYTES:-67108864}
      MAIL_MAX_PENDING: ${MAIL_MAX_PENDING:-10000}
      IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-16000000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
    - private:/app/var/private
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging: *id001
  clamav:
    image: clamav/clamav:stable@sha256:bda39705e291105049c3936e2803ac90b955172af8030f94f05dce1252df6c6d
    volumes:
    - clamav:/var/lib/clamav
    restart: unless-stopped
    mem_limit: ${CLAMAV_MEMORY_LIMIT:-2g}
    cpus: ${CLAMAV_CPUS:-1.0}
    pids_limit: 128
    logging: *id001
    healthcheck:
      test:
      - CMD
      - clamdscan
      - --ping
      - '3'
      interval: 60s
      timeout: 15s
      start_period: 180s
      retries: 3
    environment:
      CLAMD_CONF_StreamMaxLength: ${UPLOAD_MAX_FILE_BYTES:-1073741824}
      CLAMD_CONF_MaxFileSize: ${UPLOAD_MAX_FILE_BYTES:-1073741824}
      CLAMD_CONF_MaxScanSize: ${UPLOAD_MAX_BATCH_BYTES:-2147483648}
      CLAMD_CONF_MaxFiles: ${UPLOAD_MAX_FILES:-5000}
      CLAMD_CONF_AlertExceedsMax: 'yes'
volumes:
  postgres: null
  private: null
  clamav: null
