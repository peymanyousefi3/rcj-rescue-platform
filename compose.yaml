services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local untracked .env}
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: [CMD-SHELL, pg_isready -U arena]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://arena:${POSTGRES_PASSWORD}@db:5432/arena
      CLAMAV_HOST: clamav
    ports: ['127.0.0.1:8000:8000']
    volumes: ['private:/app/var/private']
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
  worker:
    build: .
    command: [python, manage.py, run_workers]
    env_file: .env
    environment:
      DATABASE_URL: postgres://arena:${POSTGRES_PASSWORD}@db:5432/arena
      CLAMAV_HOST: clamav
    volumes: ['private:/app/var/private']
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
  clamav:
    image: clamav/clamav:stable
    volumes: ['clamav:/var/lib/clamav']
    restart: unless-stopped
volumes:
  postgres:
  private:
  clamav:
